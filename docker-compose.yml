# Example deployment. Put Offbeat on the same network as Lidarr so it can
# reach it by service name (for example http://lidarr:8686) during onboarding.
services:
  offbeat:
    image: ghcr.io/offbeatos/offbeat:latest
    container_name: offbeat
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - BASE_URL=/music   # when served from a reverse proxy subpath
      # - TRUST_PROXY=true  # when behind a reverse proxy
      # - LOG_LEVEL=info
    volumes:
      - ./config:/app/config
