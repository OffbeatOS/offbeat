<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offbeat Artist Page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1180px; display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 1fr 72px; background: #111113; color: #F2F2F2; font-family: 'Instrument Sans', -apple-system, 'Helvetica Neue', sans-serif; overflow: hidden">

<nav aria-label="Main" style="grid-row: 1; background: #161618; border-right: 1px solid #222226; padding: 28px 14px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 2px; padding: 0 12px">
<span style="font-size: 22px; font-weight: 700; letter-spacing: -0.03em">offbeat</span>
<span style="width: 7px; height: 7px; border-radius: 50%; background: #FF6B4A; transform: translateY(-9px)"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
Discover
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
Search
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: #232327; color: #FF6B4A; font-size: 14px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 4v16M14.5 5l4 14"></path></svg>
<span style="color: #F2F2F2">Library</span>
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 19h16"></path></svg>
Activity
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"></path></svg>
Flows
</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path></svg>
Shows
</a>
</div>
<div style="flex-grow: 1"></div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
Settings
</a>
</nav>

<main style="grid-row: 1; display: flex; flex-direction: column; overflow: hidden">
<header style="position: relative; height: 380px; background: #2A323D; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 48px 40px; box-sizing: border-box">
<div style="position: absolute; width: 520px; height: 520px; border-radius: 50%; right: 80px; top: -180px; background: rgba(255,255,255,0.05)"></div>
<div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; right: 380px; top: 120px; background: rgba(0,0,0,0.14)"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #C9CFD8">Artist</span>
<h1 style="margin: 0; font-size: 76px; font-weight: 700; letter-spacing: -0.035em; line-height: 1">Burial</h1>
<span style="font-size: 15px; color: #C9CFD8">Future Garage, Dubstep, Electronic</span>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
<button style="height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: #F2F2F2; color: #111113; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
Monitored
</button>
<button style="height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.14); color: #F2F2F2; font-size: 14px; font-weight: 600">Add Missing</button>
<button aria-label="More options" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.14); color: #F2F2F2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
</button>
</div>
</div>
</header>

<div style="padding: 40px 48px 0; display: flex; flex-direction: column; gap: 44px">
<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Discography</h2>
<div role="group" aria-label="Release type" style="display: flex; gap: 6px">
<button aria-pressed="true" style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #F2F2F2; color: #111113; font-size: 13px; font-weight: 600">All</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1E1E21; color: #C4C4CA; font-size: 13px; font-weight: 500">Albums</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1E1E21; color: #C4C4CA; font-size: 13px; font-weight: 500">EPs</button>
<button style="height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #1E1E21; color: #C4C4CA; font-size: 13px; font-weight: 500">Compilations</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; aspect-ratio: 1; border-radius: 8px; background: {{r.color}}; overflow: hidden">
<div style="position: absolute; width: 70%; height: 70%; border-radius: 50%; left: 15%; top: 15%; border: 1px solid rgba(255,255,255,0.1)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{r.title}}</span>
<span style="font-size: 13px; color: #9A9AA0">{{r.meta}}</span>
</div>
<sc-if value="{{r.inLib}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: #B4B4BA">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
In Library
</span>
</sc-if>
<sc-if value="{{r.downloading}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 500; color: #6CB4FF">Downloading 64%</span>
<div style="height: 3px; border-radius: 2px; background: #2E2E33"><div style="width: 64%; height: 3px; border-radius: 2px; background: #6CB4FF"></div></div>
</div>
</sc-if>
<sc-if value="{{r.canAdd}}" hint-placeholder-val="{{ false }}">
<button style="align-self: flex-start; height: 28px; padding: 0 12px; border: 1px solid #34343A; border-radius: 14px; background: transparent; color: #E4E4E8; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
Add
</button>
</sc-if>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Similar Artists</h2>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{similar}}" as="s" hint-placeholder-count="6">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 140px; height: 140px; border-radius: 50%; background: {{s.color}}"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{s.name}}</span>
<span style="font-size: 12px; color: #9A9AA0">{{s.note}}</span>
</div>
</a>
</sc-for>
</div>
</section>
</div>
</main>

<footer style="grid-column: 1 / span 2; grid-row: 2; background: #19191C; border-top: 1px solid #25252A; display: flex; align-items: center; justify-content: space-between; padding: 0 28px">
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 44px; height: 44px; border-radius: 6px; background: #2C333D"></div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 260px">
<div style="display: flex; justify-content: space-between; font-size: 13px">
<span style="font-weight: 600">Antidawn</span>
<span style="color: #6CB4FF">64%</span>
</div>
<div style="height: 3px; border-radius: 2px; background: #2E2E33">
<div style="width: 64%; height: 3px; border-radius: 2px; background: #6CB4FF"></div>
</div>
<span style="font-size: 12px; color: #9A9AA0">Downloading, 1 more in queue</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 20px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px; color: #FF8A7A">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
1 failed
</span>
<a href="#" style="color: #F2F2F2; font-weight: 600">View activity</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (s) => ({ inLib: s === 'lib', downloading: s === 'dl', canAdd: s === 'add' });
    return {
      releases: [
        Object.assign({ title: 'Untrue', meta: 'Album, 2007', color: '#2F3A33' }, st('lib')),
        Object.assign({ title: 'Burial', meta: 'Album, 2006', color: '#3A3F48' }, st('lib')),
        Object.assign({ title: 'Antidawn', meta: 'EP, 2022', color: '#2C333D' }, st('dl')),
        Object.assign({ title: 'Tunes 2011-2019', meta: 'Compilation, 2019', color: '#4A3A30' }, st('add')),
        Object.assign({ title: 'Rival Dealer', meta: 'EP, 2013', color: '#3E3148' }, st('add')),
        Object.assign({ title: 'Kindred', meta: 'EP, 2012', color: '#28404A' }, st('add'))
      ],
      similar: [
        { name: 'Andy Stott', note: 'Recommended', color: '#3A4250' },
        { name: 'Kode9', note: '', color: '#4A3A3A' },
        { name: 'Four Tet', note: 'In Library', color: '#2F3F3A' },
        { name: 'Actress', note: '', color: '#403A50' },
        { name: 'Jamie xx', note: 'In Library', color: '#3E3552' },
        { name: 'Mount Kimbie', note: '', color: '#4D3038' }
      ]
    };
  }
}
</script>
</body>
</html>
