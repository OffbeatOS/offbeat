<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offbeat Tag Page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 1100px; display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 1fr 72px; background: #111113; color: #F2F2F2; font-family: 'Instrument Sans', -apple-system, 'Helvetica Neue', sans-serif; overflow: hidden">

<nav aria-label="Main" style="grid-row: 1; background: #161618; border-right: 1px solid #222226; padding: 28px 14px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: baseline; gap: 2px; padding: 0 12px">
<span style="font-size: 22px; font-weight: 700; letter-spacing: -0.03em">offbeat</span>
<span style="width: 7px; height: 7px; border-radius: 50%; background: #FF6B4A; transform: translateY(-9px)"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: #232327; color: #FF6B4A; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg><span style="color: #F2F2F2">Discover</span></a>
<a href="Search.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>Search</a>
<a href="Library.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 4v16M14.5 5l4 14"></path></svg>Library</a>
<a href="Activity.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 19h16"></path></svg>Activity</a>
<a href="Flows.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12c3-6 6-6 9 0s6 6 9 0"></path></svg>Flows</a>
<a href="Shows.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path></svg>Shows</a>
</div>
<div style="flex-grow: 1"></div>
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: #B4B4BA; font-size: 14px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Settings</a>
</nav>

<main style="grid-row: 1; padding: 40px 48px 0; display: flex; flex-direction: column; gap: 40px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 20px">
<a href="Main.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #B4B4BA"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Discover</a>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9A9AA0">Tag</span>
<h1 style="margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">Future Garage</h1>
</div>
<label style="display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; color: #C4C4CA">
Hide artists in my library
<span style="width: 44px; height: 26px; border-radius: 13px; background: #FF6B4A; position: relative; flex-shrink: 0"><span style="position: absolute; right: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></span>
</label>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Top Artists</h2>
<a href="#" style="font-size: 13px; font-weight: 600; color: #B4B4BA">See all</a>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{artists}}" as="a" hint-placeholder-count="6">
<a href="Artist.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="position: relative; width: 150px; height: 150px; border-radius: 50%; background: {{a.color}}">
<sc-if value="{{a.showAdd}}" hint-placeholder-val="{{ false }}">
<span aria-label="Add to library" style="position: absolute; right: 4px; bottom: 4px; width: 40px; height: 40px; border-radius: 50%; background: #FF6B4A; color: #1A0D08; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{a.name}}</span>
<span style="font-size: 12px; color: #9A9AA0">{{a.note}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Top Albums</h2>
<a href="#" style="font-size: 13px; font-weight: 600; color: #B4B4BA">See all</a>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{albums}}" as="al" hint-placeholder-count="6">
<a href="Album.dc.html" style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; aspect-ratio: 1; border-radius: 8px; background: {{al.color}}; overflow: hidden">
<div style="position: absolute; width: 70%; height: 70%; border-radius: 50%; left: 15%; top: 15%; border: 1px solid rgba(255,255,255,0.1)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{al.title}}</span>
<span style="font-size: 13px; color: #9A9AA0">{{al.artist}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Related Tags</h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<a href="Tag.dc.html" style="height: 38px; padding: 0 18px; border: 1px solid #2C2C31; border-radius: 19px; background: #18181B; color: #E4E4E8; font-size: 14px; font-weight: 500; display: flex; align-items: center">{{t}}</a>
</sc-for>
</div>
</section>
</main>

<footer style="grid-column: 1 / span 2; grid-row: 2; background: #19191C; border-top: 1px solid #25252A; display: flex; align-items: center; justify-content: space-between; padding: 0 28px">
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 44px; height: 44px; border-radius: 6px; background: #2C333D"></div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 260px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Antidawn</span><span style="color: #6CB4FF">64%</span></div>
<div style="height: 3px; border-radius: 2px; background: #2E2E33"><div style="width: 64%; height: 3px; border-radius: 2px; background: #6CB4FF"></div></div>
<span style="font-size: 12px; color: #9A9AA0">Downloading, 1 more in queue</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 20px; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px; color: #FF8A7A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>1 failed</span>
<a href="Activity.dc.html" style="color: #F2F2F2; font-weight: 600">View activity</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      artists: [
        { name: 'Mount Kimbie', note: 'Recommended', color: '#4D3038', showAdd: true },
        { name: 'Joy Orbison', note: '', color: '#3A4250', showAdd: false },
        { name: 'Sepalcure', note: '', color: '#2F4048', showAdd: false },
        { name: 'Jamie Woon', note: '', color: '#4A3E36', showAdd: false },
        { name: 'SBTRKT', note: '', color: '#3A3A48', showAdd: false },
        { name: 'Zomby', note: '', color: '#45503A', showAdd: false }
      ],
      albums: [
        { title: 'Crooks & Lovers', artist: 'Mount Kimbie', color: '#4D3038' },
        { title: 'Untrue', artist: 'Burial', color: '#2F3A33' },
        { title: 'In Colour', artist: 'Jamie xx', color: '#3E3552' },
        { title: 'SBTRKT', artist: 'SBTRKT', color: '#3A3A48' },
        { title: 'Mirrorwriting', artist: 'Jamie Woon', color: '#4A3E36' },
        { title: 'Where Were U in 92?', artist: 'Zomby', color: '#45503A' }
      ],
      tags: ['UK Garage', 'Post-Dubstep', 'Dubstep', '2-Step', 'Ambient', 'Electronic']
    };
  }
}
</script>
</body>
</html>
