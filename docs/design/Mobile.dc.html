<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offbeat Discover Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#F2F2F2;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #111113; color: #F2F2F2; font-family: 'Instrument Sans', -apple-system, 'Helvetica Neue', sans-serif; overflow: hidden">

<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 30px">
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.025em">Discover</h1>
<div role="group" aria-label="Discovery mode" style="display: flex; gap: 2px; padding: 3px; background: #1E1E21; border-radius: 10px">
<button style="flex-grow: 1; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #A6A6AC; font-size: 13px; font-weight: 500">Safer</button>
<button aria-pressed="true" style="flex-grow: 1; height: 36px; border: 0; border-radius: 8px; background: #34343A; color: #F2F2F2; font-size: 13px; font-weight: 600">Balanced</button>
<button style="flex-grow: 1; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #A6A6AC; font-size: 13px; font-weight: 500">Deeper</button>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em">Top Picks for You</h2>
<div style="display: flex; gap: 14px; margin-right: -20px">
<sc-for list="{{picks}}" as="p" hint-placeholder-count="2">
<a href="Artist.dc.html" style="flex-shrink: 0; width: 290px; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 190px; border-radius: 12px; background: {{p.color}}; overflow: hidden">
<div style="position: absolute; width: 200px; height: 200px; border-radius: 50%; right: -50px; top: -30px; background: rgba(255,255,255,0.06)"></div>
<span aria-label="Add to library" style="position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; background: #FF6B4A; color: #1A0D08; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #9A9AA0">{{p.reason}}</span>
<span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
</div>
</a>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em">Albums to Start With</h2>
<div style="display: flex; gap: 14px; margin-right: -20px">
<sc-for list="{{albums}}" as="al" hint-placeholder-count="3">
<a href="#" style="flex-shrink: 0; width: 140px; display: flex; flex-direction: column; gap: 8px">
<div style="position: relative; width: 140px; height: 140px; border-radius: 8px; background: {{al.color}}; overflow: hidden">
<div style="position: absolute; width: 70%; height: 70%; border-radius: 50%; left: 15%; top: 15%; border: 1px solid rgba(255,255,255,0.1)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 13px; font-weight: 500">{{al.title}}</span>
<span style="font-size: 12px; color: #9A9AA0">{{al.artist}}</span>
</div>
</a>
</sc-for>
</div>
</section>
</div>

<div style="position: absolute; left: 8px; right: 8px; bottom: 90px; height: 60px; border-radius: 12px; background: #232327; display: flex; align-items: center; gap: 12px; padding: 0 14px; box-sizing: border-box">
<div style="width: 40px; height: 40px; border-radius: 6px; background: #2C333D; flex-shrink: 0"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px">
<span style="font-weight: 600">Antidawn</span>
<span style="color: #6CB4FF">64%</span>
</div>
<div style="height: 3px; border-radius: 2px; background: #34343A"><div style="width: 64%; height: 3px; border-radius: 2px; background: #6CB4FF"></div></div>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: #161618; border-top: 1px solid #25252A; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FF6B4A; font-size: 10px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
Discover
</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9A9AA0; font-size: 10px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
Search
</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9A9AA0; font-size: 10px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 4v16M14.5 5l4 14"></path></svg>
Library
</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9A9AA0; font-size: 10px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 19h16"></path></svg>
Activity
</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9A9AA0; font-size: 10px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
More
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      picks: [
        { name: 'Andy Stott', reason: 'Because you like Burial', color: '#3A4250' },
        { name: 'Nils Frahm', reason: 'Because you like Ólafur Arnalds', color: '#4B4136' }
      ],
      albums: [
        { title: 'New Energy', artist: 'Four Tet', color: '#2F3F3A' },
        { title: 'In Colour', artist: 'Jamie xx', color: '#3E3552' },
        { title: 'Promises', artist: 'Floating Points', color: '#274055' }
      ]
    };
  }
}
</script>
</body>
</html>
